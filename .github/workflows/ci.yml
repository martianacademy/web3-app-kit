name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a branch makes the run already in flight pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor declared in `engines`, and current.
        node: [18, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Packages are built first: `typecheck` and the example resolve the
      # workspace through each package's published entry points, not its source.
      - run: pnpm build

      - run: pnpm typecheck

      - run: pnpm test

      - name: Typecheck the example
        run: pnpm --filter @web3-app-kit/example-vite-react exec tsc --noEmit
