name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  # Trusted publishing and provenance both need this; without it npm falls
  # back to asking for a token that this workflow deliberately does not have.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Node 22 ships npm 10; OIDC trusted publishing needs 11.5.1 or newer.
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

      # Packed by pnpm, published by npm, and neither half is swappable:
      # `npm pack` leaves `workspace:*` in the dependency ranges, which is
      # unpublishable, and `pnpm publish` does not do the OIDC exchange.
      - name: Pack every package
        run: |
          mkdir -p /tmp/tarballs
          for dir in packages/*/; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            # Asked of the registry directly: `npm view` answers from a local
            # cache that reports a freshly published version as missing, which
            # would send this job on to republish it and fail.
            encoded=$(node -p "encodeURIComponent(process.argv[1])" "$name")
            http_code=$(curl -fsS -o /dev/null -w '%{http_code}' \
              "https://registry.npmjs.org/$encoded/$version" || true)
            if [ "$http_code" = "200" ]; then
              echo "skip $name@$version — already on the registry"
              continue
            fi
            echo "pack $name@$version"
            pnpm --filter "$name" pack --pack-destination /tmp/tarballs
          done

      - name: Verify no workspace protocol survived
        run: |
          shopt -s nullglob
          for tarball in /tmp/tarballs/*.tgz; do
            if tar -xzOf "$tarball" package/package.json | grep -q '"workspace:'; then
              echo "::error::$tarball still contains a workspace protocol dependency"
              exit 1
            fi
          done

      - name: Publish
        run: |
          shopt -s nullglob
          published=0
          for tarball in /tmp/tarballs/*.tgz; do
            npm publish "$tarball" --access public --provenance
            published=$((published + 1))
          done
          echo "published $published package(s)"
